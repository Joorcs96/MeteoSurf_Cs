name: MeteoSurf_Cs · Previsión Diaria y Registro de Olas

on:
  schedule:
    # Ejecución automática diaria a las 06:00 UTC (07:00 CET / 08:00 CEST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: write

concurrency:
  group: prevision-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    name: MeteoSurf_Cs · Actualizar Previsión y Alerta WhatsApp
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar script de actualización de previsión
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          python backend/actualizar_prevision.py

      - name: Guardar cambios en histórico de olas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_olas.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto: actualización diaria de previsión e histórico [skip ci]"
            git push
          else
            echo "Sin cambios pendientes en historico_olas.csv."
          fi

