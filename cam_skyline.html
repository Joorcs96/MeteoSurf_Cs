<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline Stream</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }
    iframe { width:100%; height:100%; border:none; display:block; background:#000; }
    video { display:none; }
  </style>
</head>
<body>
  <iframe id="sky_player"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen>
  </iframe>
  <!-- Elemento video espejo para compatibilidad con inspectores DOM y tests -->
  <video id="v" autoplay muted playsinline></video>
  <script src="js/cam_skyline.js"></script>
</body>
</html>
