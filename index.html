<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://marine-api.open-meteo.com https://api.open-meteo.com https://generativelanguage.googleapis.com; img-src 'self' data: https:; media-src 'self' blob: https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MeteoSurf_Cs · Previsión de surf en Castellón</title>
  <meta name="description" content="Previsión de olas, viento y marea a 16 días y cámaras en directo de los spots de surf de la costa de Castellón.">
  <meta name="theme-color" content="#0b1b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeteoSurf">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://marine-api.open-meteo.com">
  <link rel="preconnect" href="https://api.open-meteo.com">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="MeteoSurf_Cs, inicio">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0a66d6"/><path d="M4 21c4 0 5-7 11-7 4 0 5 3 3 4-2 1-4-1-2-3 3-3 9-2 12 2v7H4z" fill="#fff"/><circle cx="24" cy="8" r="3" fill="#ffd23c"/></svg>
      <span>MeteoSurf<small>_Cs</small></span>
    </a>
    <nav class="topnav" aria-label="Secciones">
      <a href="#/" data-nav="hoy">Previsión</a>
      <a href="#/mapa" data-nav="mapa">Mapa</a>
      <a href="#/camaras" data-nav="camaras">Cámaras</a>
      <a href="#/asistente" data-nav="asistente">Asistente</a>
      <a href="#/favoritos" data-nav="favoritos">Favoritos</a>
    </nav>
    <span class="spacer"></span>
    <button class="icon-btn" id="refresh" aria-label="Actualizar previsión" title="Actualizar"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    <button class="icon-btn" id="theme" aria-label="Cambiar tema claro u oscuro" title="Tema"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>

  <main id="view">
    <div class="skeleton" style="height:36px;width:60%;margin:8px 0 16px"></div>
    <div class="skeleton" style="height:260px"></div>
  </main>

  <nav id="quick-spots" class="quick-spots" aria-label="Mis spots"></nav>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/" data-nav="hoy"><span class="icon-mask" style="-webkit-mask-image: url(assets/icons/waves.svg); mask-image: url(assets/icons/waves.svg)"></span>Previsión</a>
    <a href="#/mapa" data-nav="mapa"><span class="icon-mask" style="-webkit-mask-image: url(assets/icons/map.svg); mask-image: url(assets/icons/map.svg)"></span>Mapa</a>
    <a href="#/camaras" data-nav="camaras"><span class="icon-mask" style="-webkit-mask-image: url(assets/icons/video.svg); mask-image: url(assets/icons/video.svg)"></span>Cámaras</a>
    <a href="#/asistente" data-nav="asistente"><span class="icon-mask" style="-webkit-mask-image: url(assets/icons/bot.svg); mask-image: url(assets/icons/bot.svg)"></span>Asistente</a>
    <a href="#/favoritos" data-nav="favoritos"><span class="icon-mask" style="-webkit-mask-image: url(assets/icons/bookmark.svg); mask-image: url(assets/icons/bookmark.svg)"></span>Favoritos</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
