name: MeteoSurf_Cs · Observaciones en Tiempo Real

on:
  schedule:
    # Cada hora, en el minuto 12 para no coincidir con los otros cron
    - cron: '12 * * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: read

concurrency:
  group: realtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observar:
    name: MeteoSurf_Cs · Actualizar Datos Reales
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # El script tiene tiempo de espera propio en cada petición; este tope es sólo la red de
    # seguridad para que una caída de Puertos del Estado no deje el trabajo colgado.
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar Puertos del Estado y escribir data/realtime.json
        run: |
          # --comprobar sólo reescribe el fichero si las medidas cambian de verdad, así que
          # el paso de guardar abajo no encuentra nada que commitear cuando no hay novedades.
          python scripts/realtime.py --comprobar

      - name: Guardar cambios en los datos reales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/realtime.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: observaciones reales de oleaje, nivel del mar y viento [skip ci]"
            # Otros cron pueden haber publicado mientras se consultaban las estaciones.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          else
            echo "Sin cambios en data/realtime.json: las medidas siguen iguales."
          fi
