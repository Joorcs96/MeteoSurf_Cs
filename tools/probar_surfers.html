<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MeteoSurf · Prueba real de la vigía de ola (Surfers Castellón)</title>
<!--
  Banco de pruebas manual de la vigía de ola contra la emisión REAL del club.

  Se abre con el repo servido por HTTP y comprueba, en un navegador de verdad:
    1. que la emisión resuelta en data/streams.json sigue respondiendo,
    2. que el vídeo se reproduce (hls.js + CORS),
    3. que el detector ve fotogramas de la rompiente y dice cuántos píxeles claros
       (espuma) encuentra, para confirmar que la imagen llega y no sale en negro,
    4. que la grabación con búfer previo entrega un clip de bytes reales.

  Al terminar escribe el resultado en `#resultado` como texto plano, que es lo
  que lee `python scripts/probar_surfers.py`. No se sube nada a ningún sitio: el
  clip se queda en memoria y solo se mide.
-->
</head>
<body>
<p id="resultado">ejecutando…</p>
<video id="v" muted playsinline controls style="width:480px"></video>
<canvas id="lienzo" width="160" height="90"></canvas>
<pre id="detalle"></pre>
<script type="module">
import { AJUSTES_DETECCION, aGrisesReducidos, crearDetector } from '../js/deteccion.js';
import { loadStreams, urlStream, estadoStream } from '../js/cams.js';

const salida = document.getElementById('resultado');
const detalle = document.getElementById('detalle');
const lineas = [];
const anotar = (k, v) => { lineas.push(`${k}=${v}`); };
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

function cargarHls() {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
    s.onload = () => resolve(window.Hls);
    s.onerror = () => reject(new Error('no se pudo cargar hls.js'));
    document.head.appendChild(s);
  });
}

async function main() {
  const video = document.getElementById('v');
  const lienzo = document.getElementById('lienzo');
  const ctx = lienzo.getContext('2d', { willReadFrequently: true });

  await loadStreams();
  const streams = await fetch('/data/streams.json', { cache: 'no-cache' }).then((r) => r.json());
  const cam = { id: 'surfers_castellon_hls', resolver: 'ipcamlive', embedType: 'hls' };
  const estado = estadoStream(cam);
  anotar('estadoStream', estado.ok ? 'ok' : 'ko');
  if (!estado.ok) {
    detalle.textContent = estado.motivo;
    salida.textContent = 'FALLO ' + JSON.stringify(lineas);
    return;
  }
  const fuente = urlStream(cam);
  anotar('hls', fuente.includes('ipcamlive.com') ? 'ipcamlive' : 'otro');
  anotar('alias', streams.streams['surfers_castellon_hls'].alias);
  anotar('ttlMin', streams.streams['surfers_castellon_hls'].ttlMin);

  // 1. La playlist responde de verdad.
  const respuesta = await fetch(fuente);
  const cuerpo = await respuesta.text();
  anotar('playlist', respuesta.ok && cuerpo.includes('#EXTM3U') ? 'ok' : 'ko');

  // 2. Reproducción.
  const Hls = await cargarHls();
  const hls = new Hls({ lowLatencyMode: true });
  hls.loadSource(fuente);
  hls.attachMedia(video);
  await new Promise((r) => setTimeout(r, 6000));
  anotar('listo', video.readyState);
  anotar('ancho', video.videoWidth);
  anotar('alto', video.videoHeight);
  anotar('duracion', video.duration ? video.duration.toFixed(1) : '0');

  // 3. El detector ve algo. Con la cámara dealyzed no se puede exigir que haya
  //    la imagen llega: si no llegara, el fotograma saldría negro y los umbrales
  //    de foam y de oscuro saldrían a cero siempre.
  const det = crearDetector({ ...AJUSTES_DETECCION, roiAgua: [0, 1] });
  let claros = 0, oscuros = 0, suma = 0, cuadros = 0;
  for (let i = 0; i < 20; i++) {
    if (video.videoWidth) {
      ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, 0, 0, lienzo.width, lienzo.height);
      const d = ctx.getImageData(0, 0, lienzo.width, lienzo.height).data;
      const g = aGrisesReducidos(d, lienzo.width, lienzo.height, 160, 90);
      const r = det.push(g, Date.now() + i * 100);
      claros += r.espumaPx || 0;
      for (const v of g) suma += v;
      cuadros++;
      if (r.deteccion) oscuros++;
    }
    await esperar(150);
  }
  const mediaGris = cuadros ? Math.round(suma / (cuadros * 160 * 90)) : 0;
  anotar('cuadros', cuadros);
  anotar('grisMedio', mediaGris);
  anotar('pixelesEspuma', claros);
  anotar('eventos', det.estado().eventos);
  anotar('negro', mediaGris < 8 ? 'si' : 'no');

  // 4. Grabación con búfer previo: el clip tiene que existir y traer el inicio.
  let grabacion = 'sin MediaRecorder';
  if (video.captureStream && window.MediaRecorder && video.videoWidth) {
    const mime = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
      .find((t) => MediaRecorder.isTypeSupported(t));
    anotar('mime', mime || 'ninguno');
    if (mime) {
      await video.play().catch(() => {});
      const stream = video.captureStream();
      anotar('pausado', video.paused ? 'si' : 'no');
      anotar('tracks', stream.getVideoTracks().length);
      anotar('trackEstado', stream.getVideoTracks()[0]?.readyState ?? 'ninguna');
      anotar('trackMute', stream.getVideoTracks()[0]?.muted ? 'si' : 'no');
      const trozo = (ms) => new Promise((resolve) => {
        const rec = new MediaRecorder(stream, { mimeType: mime });
        const trozos = [];
        rec.ondataavailable = (e) => { if (e.data.size) trozos.push(e.data); };
        rec.onstop = () => resolve(new Blob(trozos, { type: mime }));
        rec.start();
        setTimeout(() => rec.state !== 'inactive' && rec.stop(), ms);
      });
      const pre = await trozo(3000);          // búfer previo
      const post = await trozo(2000);         // cola posterior
      const clip = new Blob([pre, post], { type: mime });
      anotar('bytesPre', pre.size);
      anotar('bytesPost', post.size);
      anotar('bytesClip', clip.size);
      // Se comprueba que el clip se puede reproducir y tiene duración real.
      const prueba = document.createElement('video');
      prueba.src = URL.createObjectURL(clip);
      let duracion = 0;
      try {
        await new Promise((r, j) => {
          prueba.onloadedmetadata = r;
          prueba.onerror = () => j(new Error('el clip ensamblado no se pudo leer'));
          setTimeout(() => j(new Error('tiempo agotado leyendo el clip')), 8000);
        });
        duracion = prueba.duration || 0;
      } catch (e) {
        anotar('errorClip', e.message);
      }
      anotar('duracionClip', duracion.toFixed(1));
      grabacion = clip.size > 0 ? 'ok' : 'ko';
      stream.getTracks().forEach((t) => t.stop());
    }
  }
  anotar('grabacion', grabacion);

  // 4b. Vía alternativa: grabar el lienzo. En un navegador sin ventana la pista de
  //     `video.captureStream()` no entrega fotogramas porque no hay compositor que
  //     la pinte, así que MediaRecorder no tiene nada que grabar. El lienzo sí se
  //     pinta (lo dibujamos nosotros, y ya se vio que llegan píxeles reales), y
  //     sirve para comprobar de verdad el grabador, el búfer previo y el ensamblado.
  let clipLienzo = 'ko';
  try {
    const grande = document.createElement('canvas');
    grande.width = 640;
    grande.height = 360;
    const gctx = grande.getContext('2d');
    const flujo = grande.captureStream(5);
    const rec = new MediaRecorder(flujo, { mimeType: 'video/webm' });
    const trozos = [];
    rec.ondataavailable = (e) => { if (e.data.size) trozos.push(e.data); };
    rec.start(500);
    let enviados = 0;
    // Con `requestAnimationFrame` el navegador sin ventana limita las pintadas a
    // unas pocas; con un temporizador el lienzo se repinta de verdad.
    const reloj = setInterval(() => {
      if (video.videoWidth) {
        gctx.drawImage(video, 0, 0, 640, 360);
        enviados++;
      }
    }, 40);
    await esperar(3000);
    clearInterval(reloj);
    await new Promise((r) => { rec.onstop = r; rec.stop(); });
    flujo.getTracks().forEach((t) => t.stop());
    const b = new Blob(trozos, { type: 'video/webm' });
    anotar('framesLienzo', enviados);
    anotar('bytesLienzo', b.size);
    clipLienzo = b.size > 0 ? 'ok' : 'ko';
    // El clip debe poder leerse y tener duración real.
    const prueba2 = document.createElement('video');
    prueba2.src = URL.createObjectURL(b);
    try {
      await new Promise((r, j) => {
        prueba2.onloadedmetadata = r;
        prueba2.onerror = () => j(new Error('clip de lienzo ilegible'));
        setTimeout(() => j(new Error('tiempo agotado')), 8000);
      });
      anotar('duracionLienzo', (prueba2.duration || 0).toFixed(1));
    } catch (e) {
      anotar('errorClipLienzo', e.message);
    }
  } catch (e) {
    anotar('errorLienzo', e.message);
  }
  anotar('grabacionLienzo', clipLienzo);

  salida.textContent = 'RESULTADO ' + JSON.stringify(lineas);
  detalle.textContent = lineas.join('\n');
}

main().catch((e) => {
  salida.textContent = 'FALLO ' + JSON.stringify([...lineas, 'error=' + e.message]);
  detalle.textContent = e.stack || e.message;
});
</script>
</body>
</html>
